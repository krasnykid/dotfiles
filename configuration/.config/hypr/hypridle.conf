general {
    # Brak komend lock_cmd / before_sleep_cmd -> zerowa obsługa blokowania ekranu
}

# Ściemnienie ekranu do 0 (fade to black) po 2 minutach bezczynności
listener {
    timeout = 120
    on-timeout = brightnessctl -s set 0% -n 500ms
    on-resume = brightnessctl -r -n 250ms
}

# (Opcjonalnie) Całkowite wyłączenie podświetlenia / sygnału po 5 minutach
listener {
    timeout = 300
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
